# Optional AI stack. Default shop compose is unchanged.
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml --profile ai up -d
# Ollama is internal-only. Do not publish 11434 on EC2.

services:
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  ollama-pull-qwen3:
    profiles: ["ai"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen3:8b"]
    restart: "no"

  ai-service:
    profiles: ["ai"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-sumanthakur30}/ai-service:${AI_IMAGE_TAG:-1.0.0}
    environment:
      SECURITY_JWT_SECRET: "${SECURITY_JWT_SECRET:-01234567890123456789012345678901}"
      SECURITY_INTERNAL_API_KEY: "${SECURITY_INVITE_INTERNAL_KEY:-dev-invite-key-change-in-production}"
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8102
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AI_DB_URL: ${AI_DB_URL:-jdbc:h2:mem:aidb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
      AI_DB_USERNAME: ${AI_DB_USERNAME:-sa}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: ${AI_DB_URL:-jdbc:h2:mem:aidb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
      SPRING_DATASOURCE_USERNAME: ${AI_DB_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${AI_DB_PASSWORD:-}
      AI_PROVIDER: OLLAMA
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      OLLAMA_BASE_URL: http://ollama:11434
      AI_ALLOW_EXTERNAL_PROVIDER: "false"
      PRODUCT_SERVICE_BASE_URL: http://product-service:8081
      ORDER_SERVICE_BASE_URL: http://order-service:8083
      GATEWAY_AI_URI: http://ai-service:8102
    ports:
      - "${AI_SERVICE_HOST_PORT:-8102}:8102"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8102/ai/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8

volumes:
  ollama_models:
