    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: notification-service
      SERVER_PORT: 8087
      NOTIFICATION_DB_URL: ${NOTIFICATION_DB_URL}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-notificationdb}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notificationdb}
      SPRING_DATASOURCE_URL: ${NOTIFICATION_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USERNAME:-notificationdb}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notificationdb}
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:-localhost}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-25}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:-}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "${SPRING_MAIL_SMTP_AUTH:-false}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}"
      # Also bind short aliases used by application.properties
      SPRING_MAIL_SMTP_AUTH: "${SPRING_MAIL_SMTP_AUTH:-false}"
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: "${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}"
      SPRING_MAIL_FROM: "${SPRING_MAIL_FROM:-${SPRING_MAIL_USERNAME:-}}"
      # School ERP SMS / WhatsApp (notification.sms|whatsapp.provider)
      NOTIFICATION_SMS_PROVIDER: "${NOTIFICATION_SMS_PROVIDER:-stub}"
      NOTIFICATION_SMS_HTTP_URL: "${NOTIFICATION_SMS_HTTP_URL:-}"
      NOTIFICATION_SMS_API_KEY: "${NOTIFICATION_SMS_API_KEY:-}"
      NOTIFICATION_WHATSAPP_PROVIDER: "${NOTIFICATION_WHATSAPP_PROVIDER:-stub}"
      NOTIFICATION_WHATSAPP_HTTP_URL: "${NOTIFICATION_WHATSAPP_HTTP_URL:-}"
      NOTIFICATION_WHATSAPP_API_KEY: "${NOTIFICATION_WHATSAPP_API_KEY:-}"
